name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    env:
      # secrets cannot be tested in step conditions directly; expose their presence as flags
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with: { version: 6.8.3, arch: clang_64, cache: true }
      - run: brew install ninja
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: Store notarization credentials
        if: env.HAS_NOTARY == 'true'
        run: xcrun notarytool store-credentials extwatch-notary --apple-id "${{ secrets.APPLE_ID }}" --team-id "${{ secrets.APPLE_TEAM_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}"
      - name: Build dmg
        env:
          QT_PREFIX: ${{ env.QT_ROOT_DIR }}
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ env.HAS_NOTARY == 'true' && 'extwatch-notary' || '' }}
        run: packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*.dmg }

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with: { version: 6.8.3, arch: win64_msvc2022_64, cache: true }
      - run: choco install innosetup --no-progress
      - name: Build installer
        env:
          SIGNTOOL_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with: { version: 6.8.3, arch: linux_gcc_64, cache: true }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libfuse2 libgl1-mesa-dev libxkbcommon-x11-0
      - run: packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/*.AppImage }

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
